<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      cursor: grab;
    }
    #pet-wrap {
      width: 250px; height: 270px;
      position: relative;
    }
    #bubble {
      position: absolute; top: 22px; left: 50%;
      transform: translateX(-50%);
      background: #fff; color: #333;
      padding: 9px 14px; border-radius: 14px;
      font-size: 14px; line-height: 1.5;
      width: max-content;
      max-width: 230px;
      white-space: normal;
      word-break: break-word;
      text-align: center;
      display: none;
      box-shadow: 0 3px 12px rgba(0,0,0,.3);
      z-index: 2;
    }
    #bubble.show { display: block; animation: pop .18s ease-out; }
    #pet {
      position: absolute; bottom: 26px; left: 50%;
      transform: translateX(-50%);
      height: 200px; /* 240x220 帧按比例缩放；待机旧帧由 JS 单独设 140px */
      pointer-events: none;
    }
    #pet.animate-bob { animation: bob 3.2s ease-in-out infinite; }
    /* 视频通道：双缓冲渲染位（媒体盒位置 / 尺寸由 pet-chain.js 按池内身体盒落位，设计档 §2.2.6） */
    #pet-stage {
      position: absolute; left: 0; top: 0; width: 640px; height: 360px;
      pointer-events: none; overflow: hidden; z-index: 0;
    }
    .pet-media {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      opacity: 0; transition: opacity .18s ease;
    }
    .pet-media.is-front { opacity: 1; }
    /* 好感度条（紧贴窗口底边） */
    /* Q 弹挤压包裹层（B20 / US-25）：包住视频通道与 PNG 通道，落体撞击时逐帧 scaleY；
       链引擎只按 id 取元素（pet-chain.js）⇒ 插层零影响；曲线/时长取自 window.PetPhysicsCore（单一来源，§2.2.7） */
    #pet-squash {
      position: absolute; left: 0; top: 0; width: 250px; height: 270px;
      transform-origin: 50% 100%;
    }
    #pet-squash .pet-media, #pet-squash #pet { pointer-events: none; }
    #affinity {
      position: absolute; bottom: 2px; left: 50%;
      transform: translateX(-50%);
      width: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      z-index: 1;
    }
    #affinity-bar {
      width: 100%; height: 8px;
      background: rgba(0,0,0,.45);
      border-radius: 999px;
      overflow: hidden;
    }
    #affinity-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ffb86b, #ff6bcb);
      border-radius: 999px;
      transition: width .6s ease;
    }
    #affinity-label {
      font-size: 10px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.8);
      line-height: 1;
      white-space: nowrap;
    }
    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-7px); }
    }
    @keyframes pop {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    /* 减少动态效果（US-19）：停本批新增的交叉淡入 + 既有 CSS 动效；链照常换段（不隐藏、不退出） */
    @media (prefers-reduced-motion: reduce) {
      .pet-media { transition: none; }
      #pet.animate-bob { animation: none; }
      #bubble.show { animation: none; }
      #affinity-fill { transition: none; }
      #pet-squash { transform: none !important; } /* B20 / US-25：reduce-motion 下不播放挤压（U-9 ①） */
    }
  </style>
</head>
<body>
  <div id="pet-wrap">
    <div id="bubble"></div>
    <div id="pet-squash">
      <div id="pet-stage">
        <video class="pet-media is-front" muted playsinline preload="none"></video>
        <video class="pet-media" muted playsinline preload="none"></video>
      </div>
      <img id="pet" draggable="false" alt="">
    </div>
    <div id="affinity">
      <div id="affinity-bar"><div id="affinity-fill"></div></div>
      <div id="affinity-label">Lv.1 好感 0</div>
    </div>
  </div>
  <script src="pet-chain-core.js"></script>
  <script src="pet-chain.js"></script>
  <script src="pet-physics-core.js"></script>
  <script src="pet.js"></script>
</body>
</html>
