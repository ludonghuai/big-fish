<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>鲸鱼娘兑换屋</title>
  <style>
    :root { --bg:#14161c; --panel:#1c1f27; --panel2:#22262f; --border:#2a2f3a; --text:#e8eaf0; --dim:#9aa3b2; --accent:#ffb86b; --gold:#ffd166; --heart:#ff7d9c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; padding:14px; }
    /* 隐藏滚动条（保留滚动能力） */
    ::-webkit-scrollbar { display:none; }
    html, body { overflow-y: auto; }
    .btn { background:#262c38; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; width:100%; }
    .btn:hover { background:#2f3644; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    #msg { margin-top:10px; font-size:12px; min-height:18px; color:var(--accent); text-align:center; }
    .hint { color:var(--dim); font-size:11px; margin-top:10px; text-align:center; }
    /* 双标签卡（B23 形态保留） */
    .tabs { display:flex; gap:8px; margin-bottom:12px; }
    .tab { flex:1; background:var(--panel); border:1px solid var(--border); color:var(--dim); border-radius:8px; padding:7px 0; cursor:pointer; font-size:13px; }
    .tab.active { background:#262c38; color:var(--text); font-weight:600; border-color:var(--accent); }
    /* B35 喂养面（US-45）：头部卡 + 食品卡片网格——与图鉴同一套视觉语言 */
    .feed-head { background:linear-gradient(135deg,#232838 0%,#1c1f27 100%); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
    .feed-head .fh-title { font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; margin-bottom:10px; }
    .fh-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .fh-cell { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
    .fh-cell .label { color:var(--dim); font-size:11px; }
    .fh-cell .val { font-weight:600; font-size:14px; margin-top:2px; }
    .fh-cell .val.gold { color:var(--gold); }
    .fh-rate { color:var(--dim); font-size:11px; margin-top:10px; text-align:center; }
    .food-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:12px; }
    .food-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; }
    .food-card .emoji { font-size:28px; }
    .food-card .name { font-weight:600; font-size:13px; }
    .food-card .owned { color:var(--dim); font-size:11px; }
    .food-card .desc { color:var(--dim); font-size:11px; min-height:28px; }
    .food-card .price { color:var(--gold); font-weight:700; font-size:13px; }
    .food-card .buy { background:#2f3644; border:1px solid var(--border); color:#fff; border-radius:8px; padding:5px 0; cursor:pointer; font-size:12px; width:100%; margin-top:4px; }
    .food-card .buy:hover { background:#3a4354; }
    .food-card .buy:disabled { opacity:.4; cursor:not-allowed; }
    /* B35 图鉴面（US-46）：进度头 + 视频卡片墙 */
    .g-head { background:linear-gradient(135deg,#232838 0%,#1c1f27 100%); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
    .g-head .gh-title { font-size:14px; font-weight:700; margin-bottom:8px; }
    .gh-progress { height:8px; background:var(--panel); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .gh-progress .bar { height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); width:0; }
    .gh-stats { display:flex; gap:12px; align-items:center; margin-top:8px; color:var(--dim); font-size:11px; flex-wrap:wrap; }
    .gh-stats b { color:var(--text); }
    .gh-fav { margin-left:auto; display:flex; align-items:center; gap:4px; cursor:pointer; user-select:none; }
    .g-group { margin:14px 0 8px; color:var(--dim); font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; }
    .g-group .cnt { font-weight:400; font-size:11px; }
    .g-wall { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
    .g-empty { color:var(--dim); font-size:12px; text-align:center; padding:24px 0; }
    .g-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
    .g-card.locked { opacity:.55; }
    .g-card.blocked-card { opacity:.45; }
    .g-video { position:relative; width:100%; aspect-ratio:16/9; background:#0e1014; }
    .g-video video { width:100%; height:100%; object-fit:contain; display:block; }
    .g-body { padding:8px 10px 10px; display:flex; flex-direction:column; gap:4px; flex:1; }
    .g-name { font-weight:700; font-size:12px; }
    .g-cond { color:var(--dim); font-size:11px; min-height:15px; }
    .g-badges { display:flex; gap:4px; flex-wrap:wrap; min-height:18px; }
    .g-badge { font-size:10px; border-radius:6px; padding:1px 6px; border:1px solid var(--border); color:var(--dim); }
    .g-badge.b-unlocked { color:#8fd18f; border-color:#3c5a3c; }
    .g-badge.b-liked { color:var(--heart); border-color:#5a3c46; }
    .g-badge.b-blocked { color:#ff8f8f; border-color:#5a3c3c; }
    .g-badge.b-priv { color:var(--gold); border-color:#5a523c; }
    .g-badge.b-tag { color:var(--accent); }
    .g-ops { display:flex; gap:6px; margin-top:auto; }
    .g-op { flex:1; background:#262c38; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:4px 0; cursor:pointer; font-size:12px; }
    .g-op:hover { background:#2f3644; }
    .g-op.on-like { color:var(--heart); border-color:#5a3c46; }
    .g-op.on-block { color:#ff8f8f; border-color:#5a3c3c; }
    .g-note { color:var(--dim); font-size:10px; text-align:center; padding:4px 0; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" id="tab-food">喂养</button>
    <button class="tab" id="tab-unlock">图鉴</button>
  </div>

  <div id="panel-food">
    <div class="feed-head" id="feed-head">
      <div class="fh-title">🐳 鲸鱼娘兑换屋</div>
      <div class="fh-grid">
        <div class="fh-cell"><div class="label">好感度</div><div class="val" id="affinity">Lv.1 · 0 点</div></div>
        <div class="fh-cell"><div class="label">💴 余额</div><div class="val gold" id="currency">0</div></div>
        <div class="fh-cell"><div class="label">可兑换 token 余额</div><div class="val" id="tokens">0</div></div>
        <div class="fh-cell"><div class="label">累计消耗 token（好感来源）</div><div class="val" id="usage">0</div></div>
      </div>
      <button class="btn" id="exchange" style="margin-top:10px">兑换 💴</button>
      <div class="fh-rate" id="rate-hint">10000 token = 1💴</div>
      <div id="msg"></div>
    </div>
    <div class="hint">用 💴 给鲸鱼娘买吃的，喂食也会加好感哦</div>
    <div class="food-grid" id="foods"></div>
    <div class="hint">右键鲸鱼娘随时打开本窗口</div>
  </div>

  <div id="panel-unlock" hidden>
    <div class="g-head" id="gallery-head">
      <div class="gh-title">动作图鉴</div>
      <div class="gh-progress"><div class="bar" id="gallery-bar"></div></div>
      <div class="gh-stats">
        <span>收集 <b id="gallery-total">0 / 0（0%）</b></span>
        <span>♥ 喜欢 <b id="gallery-liked">0</b></span>
        <span>已屏蔽 <b id="gallery-blocked">0</b></span>
        <label class="gh-fav"><input type="checkbox" id="fav-only"> 只看喜欢</label>
      </div>
    </div>
    <div id="gallery"></div>
  </div>

  <script src="pet-unlock-core.js"></script>
  <script src="exchange.js"></script>
</body>
</html>
